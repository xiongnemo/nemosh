# yaml-language-server: $schema=https://nfpm.goreleaser.com/schema.json
#
# Template, not a config: .github/workflows/release.yml replaces the @NAME@
# placeholders before nFPM reads it. The Linux build is static (CGO_ENABLED=0),
# so one binary serves the glibc packages and the musl one alike.
name: nemosh
arch: "@NFPM_ARCH@"
platform: linux
version: "@NFPM_VERSION@"
version_schema: semver
release: "1"
section: shells
maintainer: xiongnemo <xiongnemo@users.noreply.github.com>
description: |-
  BusyBox-style shell and applets in one executable (@NEMOSH_VERSION@).
  Windows is the supported platform; this Linux build is published as a
  convenience and is not supported.
vendor: xiongnemo
homepage: https://github.com/xiongnemo/nemosh
license: Apache-2.0
disable_globbing: true
contents:
  - src: "@NFPM_BINARY@"
    dst: /usr/bin/nemosh
    file_info:
      mode: 0755
  - src: "@NFPM_DOCS@/LICENSE"
    dst: /usr/share/doc/nemosh/LICENSE
  - src: "@NFPM_DOCS@/NOTICE"
    dst: /usr/share/doc/nemosh/NOTICE
  - src: "@NFPM_DOCS@/THIRD-PARTY-NOTICES.md"
    dst: /usr/share/doc/nemosh/THIRD-PARTY-NOTICES.md
