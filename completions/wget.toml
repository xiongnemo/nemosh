[meta]
# One name, two programs. On the machine this was written on `wget` resolves to
# busybox's applet, not GNU wget, and their option sets barely overlap -- GNU has
# some two hundred long options and busybox has four. A spec for one of them is
# wrong for the other, and nothing about the *name* says which is installed.
#
# So this describes busybox's, because that is what could be measured here, and
# says so loudly. A machine with GNU wget should generate its own:
#
#	python3 scripts/completions/generate.py wget > ~/.config/nemosh/completions/wget.toml
#
# A user file wins over this one, so that is the whole fix.
derived-from = "wget --help"
tool-version = "BusyBox v1.38.0-FRP-6075-g169694ebd wget applet"
measured-on = "2026-08-16"

[command]
name = "wget"
operand = "path"
short = "cqSOoPUY"
value-short = "OoPUY"
file-short = "OoP"
long = ["spider", "header", "post-data", "post-file"]
value-long = ["header", "post-data", "post-file"]
file-long = ["post-file"]
