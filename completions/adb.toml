[meta]
# adb prints no `usage:` synopsis at all, so the generator's synopsis reader gets
# nothing from it. What it does print is structured: ` -x  description` under
# `global options:`, and ` subcommand ARGS  description` under section headings.
# Both were read off that.
#
# What is deliberately *not* here is the part that matters most for adb: the
# serial numbers `-s` wants, the package names `uninstall` wants, the remote
# paths `pull` wants. None of those are in any help text and never will be --
# they come from running adb, which no spec can do yet.
derived-from = "adb --help"
tool-version = "Android Debug Bridge version 1.0.41 / Version 37.0.0-14910828"
measured-on = "2026-08-16"

[command]
name = "adb"
operand = "none"
short = "adestHPL"
value-short = "stHPL"
long = ["one-device", "exit-on-write-error"]
value-long = ["one-device"]

# The subcommands, from the section headings of the same help. Each carries only
# what could be read there; an operand kind of "none" means adb takes nothing
# further, not that nothing is known.
[[subcommand]]
name = "devices"
operand = "none"
short = "l"

[[subcommand]]
name = "install"
operand = "path"

[[subcommand]]
name = "install-multiple"
operand = "path"

[[subcommand]]
name = "install-multi-package"
operand = "path"

