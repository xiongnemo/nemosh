id = "shell.posix.brace-group.reserved-word-boundary"
area = "shell"
kind = "golden"
semantics = "posix"
platforms = ["windows", "linux", "darwin"]
references = ["posix", "busybox-ash", "dash", "bash-posix"]

script = '''
{ echo ok; }
'''

