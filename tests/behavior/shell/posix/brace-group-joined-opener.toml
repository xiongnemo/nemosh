id = "shell.posix.brace-group.joined-opener-rejected"
area = "shell"
kind = "golden"
semantics = "posix"
platforms = ["windows", "linux", "darwin"]
references = ["posix", "busybox-ash", "dash", "bash-posix"]

script = '''
{echo bad;}
'''

[expect]
status = 2
stdout = ""
stderr = "nemosh: syntax error: unexpected }\n"

[notes]
standard = "POSIX.1 shell command language, reserved words"
why = "A brace joined to command text is not an opening brace-group reserved word, so `{echo` is an ordinary command word and the `}` that follows has nothing to close. The rejection names the closer, which is what bash (\"syntax error near unexpected token `}'\") and dash (\"Syntax error: \\\"}\\\" unexpected\") both name too. Nemosh still refuses the whole script before running `{echo`, which is the no-prefix-effects guarantee this case exists to pin; bash and dash would reach it."
