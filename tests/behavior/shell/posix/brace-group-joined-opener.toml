id = "shell.posix.brace-group.joined-opener-rejected"
area = "shell"
kind = "golden"
semantics = "posix"
platforms = ["windows", "linux", "darwin"]
references = ["posix", "busybox-ash", "dash", "bash-posix"]

script = '''
{echo bad;}
'''

[expect]
status = 2
stdout = ""
stderr = "nemosh: unsupported syntax: {\n"

[notes]
standard = "POSIX.1 shell command language, reserved words"
why = "A brace joined to command text is not an opening brace-group reserved word. The rejection now names the brace rather than the closer, because the `;` splits this into two lines before either is parsed and the offending `{` is on the first of them. dash and bash instead treat `{echo` as an ordinary command word and only fail at the `}`; Nemosh refuses the whole script, which keeps the no-prefix-effects guarantee this case exists to pin."
