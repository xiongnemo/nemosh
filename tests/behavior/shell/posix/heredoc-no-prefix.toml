id = "shell.posix.heredoc.no-prefix"
area = "shell"
kind = "golden"
semantics = "posix"
platforms = ["windows", "linux", "darwin"]
references = ["posix", "busybox-ash", "dash", "bash-posix"]

script = '''
echo must-not-run
cat <<EOF
unterminated
'''

[expect]
status = 0
stdout = "must-not-run\nunterminated\n"
stderr = "nemosh: line 3: warning: here-document at line 2 delimited by end-of-file (wanted `EOF')\n"

[notes]
standard = "POSIX.1 shell command language, here-documents"
why = "A heredoc the end of a script reaches before its delimiter ends there, as both references end it, and the script runs. The whole script is still parsed before any of it runs, so bash's warning comes first."

[differential]
diverges = ["busybox-ash", "dash"]
why = "The output and status are every reference's. The warning is bash's; busybox and dash end the body without a word. The user chose bash's warning on 2026-10-04; until then the whole script was refused."
