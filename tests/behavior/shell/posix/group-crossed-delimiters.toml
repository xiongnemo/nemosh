id = "shell.posix.group.crossed-delimiters-rejected"
area = "shell"
kind = "golden"
semantics = "posix"
platforms = ["windows", "linux", "darwin"]
references = ["posix", "busybox-ash", "dash", "bash-posix"]

script = '''
echo prefix
( { echo mixed; ) echo leaked; }
'''

[expect]
status = 2
stdout = ""
stderr = "nemosh: syntax error: unexpected ), expected }\n"

[notes]
standard = "POSIX.1 shell command language, compound commands"
why = "Crossed group delimiters are malformed during parse and cannot execute a valid prefix."

[differential]
diverges = ["dash", "bash-posix", "posix", "busybox-ash"]
why = "The references run the prefix of the script and only then fail on the malformed grouping. Nemosh refuses the whole script before any effect, which is the no-prefix-effects guarantee P0.3 pins and this case exists to state."
