id = "applet.busybox-w32.env.missing-command"
area = "applet"
kind = "golden"
semantics = "busybox-w32"
platforms = ["windows", "linux", "darwin"]
references = ["busybox-w32"]
script = "env nosuchcommand\n"

[expect]
status = 127
stdout = ""
stderr = "env: nosuchcommand: not found\n"

[notes]
standard = "BusyBox-w32 coreutils/env.c and libbb/executable.c"
why = "BusyBox hands COMMAND to BB_EXECVP_or_die, which raises xfunc_error_retval to 127 for ENOENT before it dies (libbb/executable.c:117-122). Nemosh matches the status. The wording stays `not found` rather than BusyBox's `cannot execute 'NAME': No such file or directory` because nemosh's env dispatches registered applets only, so no execvp ran and claiming ENOENT would misdescribe the mechanism; see docs/design/v0-readiness.md."
