id = "applet.busybox-w32.head.smoke"
area = "applet"
kind = "golden"
semantics = "busybox-w32"
platforms = ["windows", "linux", "darwin"]
references = ["busybox-w32"]
script = "head -n 2 a.txt\n"

[files]
"a.txt" = "1\n2\n3\n"

[expect]
status = 0
stdout = "1\n2\n"
stderr = ""

[notes]
standard = "BusyBox-w32 coreutils/head.c"
why = "`-n COUNT` caps the output at COUNT lines and, with a single operand, head prints no `==> NAME <==` banner (coreutils/head.c:230-260)."
