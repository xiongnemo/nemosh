id = "applet.busybox-w32.sort.missing-file"
area = "applet"
kind = "golden"
semantics = "busybox-w32"
platforms = ["windows", "linux", "darwin"]
references = ["busybox-w32"]
command = ["sort", "missing-sort-input.txt"]

[expect]
status = 2
stdout = ""
stderr = "sort: missing-sort-input.txt: No such file or directory\n"

[notes]
standard = "BusyBox-w32 sort utility"
