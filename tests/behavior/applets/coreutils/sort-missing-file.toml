id = "applet.busybox-w32.sort.missing-file"
area = "applet"
kind = "golden"
semantics = "busybox-w32"
platforms = ["windows", "linux", "darwin"]
references = ["busybox-w32"]
command = ["sort", "missing-sort-input.txt"]

[expect]
status = 2
stdout = ""
stderr = "sort: missing-sort-input.txt: No such file or directory\n"

[notes]
standard = "BusyBox-w32 sort utility"
why = "BusyBox-w32 sort aborts on the first open error by design -- coreutils 6.9 compat (coreutils/sort.c:566) -- and exits 2 because sort_main raised xfunc_error_retval. cut, by contrast, continues to the next operand and exits 1."
