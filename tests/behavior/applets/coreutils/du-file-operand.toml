id = "applet.coreutils.du.file-operand"
area = "applet"
kind = "golden"
semantics = "posix"
platforms = ["windows", "linux", "darwin"]
references = ["busybox-w32", "uutils"]
files = { "one.txt" = "0123456789" }
script = '''
du one.txt | wc -l
du one.txt | cut -f2
case "$(du -h one.txt | cut -f1)" in
*.[0-9]K) echo "human form" ;;
*) echo "unexpected: $(du -h one.txt)" ;;
esac
'''

[expect]
status = 0
stdout = "1\none.txt\nhuman form\n"
stderr = ""

[notes]
standard = "POSIX du: a file operand is reported, not skipped"
why = "Found by a differential sweep over the applet surface uutils' tests cover. `du somefile` printed nothing and exited 0, and `du -sh somefile` printed 0K for a file with bytes in it: only directories were recorded for output, and a file's blocks were charged to its parents rather than to itself -- right for a file inside a tree, wrong for one named on the command line. Both silent. The block count itself is a property of the volume rather than of the file, so it is pinned separately for Windows in du-allocated-size.toml and only the shape is asserted here."
