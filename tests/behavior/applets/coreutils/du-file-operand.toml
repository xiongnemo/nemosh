id = "applet.coreutils.du.file-operand"
area = "applet"
kind = "golden"
semantics = "posix"
platforms = ["windows", "linux", "darwin"]
references = ["busybox-w32", "uutils"]
files = { "one.txt" = "0123456789" }
script = '''
du one.txt
du -h one.txt
du -sh one.txt
'''

[expect]
status = 0
stdout = "1\tone.txt\n1.0K\tone.txt\n1.0K\tone.txt\n"
stderr = ""

[notes]
standard = "POSIX du: a file operand is reported, not skipped"
why = "Found by a differential sweep over the applet surface uutils' tests cover. `du somefile` printed nothing and exited 0, and `du -sh somefile` printed 0K for a file with bytes in it: only directories were recorded for output, and a file's blocks were charged to its parents rather than to itself -- right for a file inside a tree, wrong for one named on the command line. Both silent. The human form also dropped the decimal from a whole number, printing 4K where both references print 4.0K. The block *count* still differs from busybox-w32, which reports allocated size and so says 4 for a file inside one NTFS cluster where this says 1; that is recorded as a gap in v0-readiness.md rather than fixed here, because allocated size on Windows needs the security and file-information APIs."
