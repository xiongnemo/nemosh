id = "applet.busybox-w32.bracket.missing-bracket"
area = "applet"
kind = "golden"
semantics = "busybox-w32"
platforms = ["windows", "linux", "darwin"]
references = ["busybox-w32"]
script = "[ -n x\n"

[expect]
status = 2
stdout = ""
stderr = "[: missing ]\n"

[notes]
standard = "BusyBox-w32 coreutils/test.c"
why = "test_main2 strips argv[0] and demands the last remaining word be a lone `]`, printing `missing ]` and returning 2 when it is not (coreutils/test.c:897-901, NOT_LONE_CHAR at include/libbb.h:1154). Nemosh matches. The expression grammar behind the bracket is still a stub; see docs/design/v0-readiness.md."
