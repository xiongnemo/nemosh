id = "applet.busybox-w32.uniq.missing-file"
area = "applet"
kind = "golden"
semantics = "busybox-w32"
platforms = ["windows", "linux", "darwin"]
references = ["busybox-w32"]
command = ["uniq", "missing-uniq-input.txt"]

[expect]
status = 1
stdout = ""
stderr = "uniq: can't open 'missing-uniq-input.txt': No such file or directory\n"

[notes]
standard = "BusyBox-w32 uniq utility"
why = "BusyBox-w32 uniq opens its input with xopen, which quotes the operand behind a verb (libbb/xfuncs_printf.c:151) and dies on the EXIT_FAILURE default. cut and sort use fopen_or_warn_stdin instead and print the operand bare."
