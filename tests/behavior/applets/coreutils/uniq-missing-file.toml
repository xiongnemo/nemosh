id = "applet.busybox-w32.uniq.missing-file"
area = "applet"
kind = "golden"
semantics = "busybox-w32"
platforms = ["windows", "linux", "darwin"]
references = ["busybox-w32"]
command = ["uniq", "missing-uniq-input.txt"]

[expect]
status = 2
stdout = ""
stderr = "uniq: missing-uniq-input.txt: No such file or directory\n"

[notes]
standard = "BusyBox-w32 uniq utility"
why = "BusyBox-w32 uniq reports input open failures with non-zero status; Nemosh uses status 2 like the first sort slice."
