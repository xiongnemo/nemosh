id = "applet.busybox-w32.sort.reject-invalid-option"
area = "applet"
kind = "golden"
semantics = "busybox-w32"
platforms = ["windows", "linux", "darwin"]
references = ["busybox-w32"]
command = ["sort", "-x"]

[expect]
status = 2
stdout = ""
stderr = "sort: invalid option -- x\n"

[notes]
standard = "BusyBox-w32 sort utility"
why = "sort_main sets xfunc_error_retval = 2 before parsing options (coreutils/sort.c:468), so its bb_show_usage death exits 2 where cut and uniq exit 1. Nemosh prints a one-line diagnostic in place of the usage text."
