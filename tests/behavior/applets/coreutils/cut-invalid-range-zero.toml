id = "applet.busybox-w32.cut.invalid-range-zero"
area = "applet"
kind = "golden"
semantics = "busybox-w32"
platforms = ["windows", "linux", "darwin"]
references = ["busybox-w32"]
command = ["cut", "-c", "0"]

[expect]
status = 1
stdout = ""
stderr = "cut: invalid range 0\n"

[notes]
standard = "BusyBox-w32 cut utility"
why = "BusyBox-w32 cut rejects zero as a range endpoint through bb_error_msg_and_die (coreutils/cut.c:386), which exits 1. BusyBox spells the operand as a pair, 'invalid range 0-0'; Nemosh echoes the range as written."
