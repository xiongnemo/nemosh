id = "applet.busybox-w32.date.reject-set-time"
area = "applet"
kind = "golden"
semantics = "busybox-w32"
platforms = ["windows", "linux", "darwin"]
references = ["busybox-w32"]
command = ["date", "-s", "@0"]

[expect]
status = 1
stdout = ""
stderr = "date: cannot set date: Operation not permitted\n"

[notes]
standard = "BusyBox-w32 date utility"
why = "Setting the system clock is refused. busybox-w32 without the privilege answers `date: can't set date: Operation not permitted`, and this says the same, in its own `cannot`, whatever the privilege: -s is read, and its TIME checked, before the refusal. It said `unsupported option: -s` while the first date slice read no -s at all."
