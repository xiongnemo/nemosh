id = "applet.busybox-w32.bracket.smoke"
area = "applet"
kind = "golden"
semantics = "busybox-w32"
platforms = ["windows", "linux", "darwin"]
references = ["busybox-w32"]
script = "[ -n x ] && echo nonempty\n[ a = a ] && echo same\n"

[expect]
status = 0
stdout = "nonempty\nsame\n"
stderr = ""

[notes]
standard = "BusyBox-w32 coreutils/test.c"
why = "BusyBox registers `[` as test with a mandatory trailing `]` and strips it before evaluating (coreutils/test.c:894-908). Nemosh's stub implements the one- and two-argument string tests plus `=` and `!=`, which is what this pins."
