id = "applet.busybox-w32.cut.invalid-option"
area = "applet"
kind = "golden"
semantics = "busybox-w32"
platforms = ["windows", "linux", "darwin"]
references = ["busybox-w32"]
command = ["cut", "-x"]

[expect]
status = 1
stdout = ""
stderr = "cut: invalid option -- x\n"

[notes]
standard = "BusyBox-w32 cut utility"
why = "BusyBox-w32 cut leaves xfunc_error_retval at the EXIT_FAILURE default, so its bb_show_usage death exits 1. Nemosh prints a one-line diagnostic in place of the usage text."
