id = "applet.busybox-w32.uniq.invalid-option"
area = "applet"
kind = "golden"
semantics = "busybox-w32"
platforms = ["windows", "linux", "darwin"]
references = ["busybox-w32"]
command = ["uniq", "-x"]

[expect]
status = 1
stdout = ""
stderr = "uniq: invalid option -- x\n"

[notes]
standard = "BusyBox-w32 uniq utility"
why = "BusyBox-w32 uniq never raises xfunc_error_retval, so its bb_show_usage death exits 1. Nemosh prints a one-line diagnostic in place of the usage text."
