id = "applet.busybox-w32.chmod.invalid-mode"
area = "applet"
kind = "golden"
semantics = "busybox-w32"
platforms = ["windows", "linux", "darwin"]
references = ["busybox-w32"]
script = "chmod zzz a.txt\n"

[files]
"a.txt" = "x\n"

[expect]
status = 1
stdout = ""
stderr = "chmod: zzz: invalid mode\n"

[notes]
standard = "BusyBox-w32 coreutils/chmod.c"
why = "BusyBox rejects an unparsable mode with `bb_error_msg_and_die(\"invalid mode '%s'\", smode)` (coreutils/chmod.c:87), i.e. `chmod: invalid mode 'zzz'`. Nemosh reports the same failure operand-first and unquoted. The status matches, the wording does not; see docs/design/v0-readiness.md."
