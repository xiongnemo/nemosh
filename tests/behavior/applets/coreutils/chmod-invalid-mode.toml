id = "applet.busybox-w32.chmod.invalid-mode"
area = "applet"
kind = "golden"
semantics = "busybox-w32"
platforms = ["windows", "linux", "darwin"]
references = ["busybox-w32"]
script = "chmod zzz a.txt\n"

[files]
"a.txt" = "x\n"

[expect]
status = 1
stdout = ""
stderr = "chmod: invalid mode 'zzz'\n"

[notes]
standard = "BusyBox-w32 coreutils/chmod.c"
why = "BusyBox rejects an unparsable mode with `bb_error_msg_and_die(\"invalid mode '%s'\", smode)` (coreutils/chmod.c:87). Nemosh used to report the same failure operand-first and unquoted; it now matches, message-first and quoted."
