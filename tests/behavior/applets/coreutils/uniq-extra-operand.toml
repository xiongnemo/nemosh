id = "applet.busybox-w32.uniq.extra-operand"
area = "applet"
kind = "golden"
semantics = "busybox-w32"
platforms = ["windows", "linux", "darwin"]
references = ["busybox-w32"]
script = "uniq first.txt second.txt third.txt\n"

[files]
"first.txt" = "a\n"

[expect]
status = 1
stdout = ""
stderr = "uniq: extra operand 'third.txt'\n"

[notes]
standard = "BusyBox-w32 uniq utility"
why = "BusyBox-w32 reads OUTPUT as the second operand (coreutils/uniq.c:78) and shows usage on a third, once INPUT is open, which is why first.txt is there; status 1 is the bb_show_usage default. Nemosh prints a one-line diagnostic in place of the usage text. This case was two operands while Nemosh deferred OUTPUT; it takes it now."
