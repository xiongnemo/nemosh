id = "applet.busybox-w32.rmdir.smoke"
area = "applet"
kind = "golden"
semantics = "busybox-w32"
platforms = ["windows", "linux", "darwin"]
references = ["busybox-w32"]
script = "mkdir gone\nrmdir gone\nls\n"

[files]
"a.txt" = ""

[expect]
status = 0
stdout = "a.txt\n"
