id = "applet.busybox-w32.chmod.smoke"
area = "applet"
kind = "golden"
semantics = "busybox-w32"
platforms = ["windows", "linux", "darwin"]
references = ["busybox-w32"]
script = "chmod 600 a.txt\ncat a.txt\n"

[files]
"a.txt" = "payload\n"

[expect]
status = 0
stdout = "payload\n"
stderr = ""

[notes]
standard = "BusyBox-w32 coreutils/chmod.c"
why = "Windows carries no POSIX mode bits beyond the read-only attribute, so what this pins is the contract that a well-formed octal mode succeeds silently and leaves the file readable."
