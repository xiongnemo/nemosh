id = "applet.busybox-w32.date.unix-seconds"
area = "applet"
kind = "golden"
semantics = "busybox-w32"
platforms = ["windows", "linux", "darwin"]
references = ["busybox-w32"]
command = ["date", "-u", "-d", "@1", "+%s"]

[expect]
status = 0
stdout = "1\n"
