id = "applet.busybox-w32.sort.invalid-option"
area = "applet"
kind = "golden"
semantics = "busybox-w32"
platforms = ["windows", "linux", "darwin"]
references = ["busybox-w32"]
command = ["sort", "-z"]

[expect]
status = 2
stdout = ""
stderr = "sort: invalid option -- z\n"

[notes]
standard = "BusyBox-w32 sort utility"
why = "BusyBox-w32 sort accepts -z (NUL-terminated lines); Nemosh has not implemented it yet and rejects it. The status is right for the wrong reason: sort_main sets xfunc_error_retval = 2 (coreutils/sort.c:468), so every sort failure exits 2."
