id = "applet.busybox-w32.sort.invalid-option"
area = "applet"
kind = "golden"
semantics = "busybox-w32"
platforms = ["windows", "linux", "darwin"]
references = ["busybox-w32"]
command = ["sort", "-j"]

[expect]
status = 2
stdout = ""
stderr = "sort: unknown option -- j\n"

[notes]
standard = "BusyBox-w32 sort utility"
why = "-j is none of busybox's sort letters, nghMVucszbrdfim and S: T: o: k: t:. This case asked -z, which busybox takes and Nemosh once refused; it takes it now. sort_main sets xfunc_error_retval = 2 (coreutils/sort.c:468), so every sort failure exits 2."
