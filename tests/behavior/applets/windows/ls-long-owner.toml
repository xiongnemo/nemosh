id = "applet.coreutils.ls.long-owner"
area = "applet"
kind = "golden"
semantics = "busybox-w32"
platforms = ["windows"]
references = ["busybox-w32"]
files = { "mine.txt" = "x" }
script = '''
set -- $(ls -l mine.txt)
if [ "$3" = "$4" ]; then echo "group repeats owner"; else echo "owner=$3 group=$4"; fi
set -- $(ls -l /c/Windows/explorer.exe)
echo "system owner=$3"
'''

[expect]
status = 0
stdout = "group repeats owner\nsystem owner=root\n"
stderr = ""

[notes]
standard = "busybox-w32 maps a Windows owner SID onto a POSIX-shaped name"
why = "The rule is measured from two observations against busybox-w32: a file owned by the running account prints that account's name, and one owned by NT SERVICE\\TrustedInstaller prints `root`. So a real user account gives its name and anything else -- a service identity, Administrators, SYSTEM -- gives root, which is the same uid-0 emulation currentUserID already applies to the process. explorer.exe is used because it is present on every Windows install and is not owned by the user running the tests. The lookup costs 29 microseconds per file with the SID-to-name cache and 170 without, measured over the 4,895 files in System32; the remainder is the per-file security query, which cannot be cached."
