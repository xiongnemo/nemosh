id = "applet.nemosh.top.batch-sample"
area = "applet"
kind = "golden"
semantics = "nemosh"
platforms = ["windows"]
references = ["nemosh"]
script = '''
top -b -n 1 | head -n 5 | cut -c1-4
echo ---
top -b -n 1 | head -n 1 | sed 's/[0-9]//g' | sed 's/up .*processes/processes/'
echo ---
top -b -n 1 | wc -l | xargs test 20 -lt && echo "many rows"
echo ---
top -s nope -b 2>&1 | head -n 1
'''

[expect]
status = 0
stdout = "top \nCPU:\nMem:\nComm\n    \n---\ntop - processes,  threads,  running\n---\nmany rows\n---\ntop: unknown sort column: nope\n"
stderr = ""

[notes]
standard = "Nemosh process monitor; top -b is the plain form every top has"
why = "The drawn form needs a terminal and cannot be tested here at all, so the plain form is written first and the interactive view is built from the same rows -- a monitor whose two forms disagree is a monitor with two bugs. The numbers are the machine's and cannot be pinned, so what is checked is the shape: four header lines in a fixed order, a column header row, and more than twenty processes, which any real Windows machine has. Digits are stripped from the header so its wording is checked without its values, and the uptime clause is cut out altogether -- it carries a days field on a machine that has been up for days and not on one that has not, so pinning either spelling pins a fact about the machine. This fixture did exactly that on the first attempt and failed on a freshly booted CI runner, which is the third time that mistake has been made here; the other two were in du's tests. An unknown sort column is refused by name rather than ignored, because a script naming a column that has since been renamed should hear about it."
