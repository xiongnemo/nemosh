name: Product

# This is the gate the readiness ledger means by "product CI": it builds Nemosh,
# runs its tests, executes the behavior corpus against a freshly built binary,
# and holds the repository's own rules -- formatting, vet on three platforms, and
# the 250-pure-LOC ceiling per production file.
#
# The research probe workflow next to this one exercises reference shells only
# and is not evidence about Nemosh.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS earns its place by *executing* the `_other.go` half of every
        # platform split -- process listing, identity, executability, device
        # input. Those files are compiled for darwin by `GOOS=darwin go build`
        # below, and compiling is not running: a nil map, a wrong path
        # separator, or a syscall that returns a different errno there survives
        # a cross-compile untouched. Linux runs the same files, so this is not
        # redundant only because darwin and linux disagree often enough to
        # matter (case-insensitive filesystem by default, BSD userland).
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      # Actions are pinned to commit SHAs, not tags. A tag is mutable, so `@v4`
      # is a promise the upstream owner can rewrite at any time; the comment
      # records which tag the SHA stood for when it was pinned.
      #
      # fetch-depth: 0 is required, not tidiness: the version is derived from
      # the nearest semver tag, and a shallow clone has no tags, so it would
      # silently produce the v0.0.1 fallback for every build.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      # Windows is the first-class target, so its own reference shell is what
      # the differential runner should have. Ubuntu already ships dash and bash.
      - name: Install busybox (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: choco install busybox --no-progress -y || echo "busybox unavailable; the differential runner will skip it"

      - name: Install dash (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y dash busybox

      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      # Nemosh is Windows-first but must keep compiling for the two Unix targets,
      # because the platform splits are what would rot silently otherwise.
      - name: go vet (cross-platform)
        shell: bash
        run: |
          GOOS=linux go vet ./...
          GOOS=darwin go build ./...
          GOOS=windows go build ./...

      - name: go test
        run: go test -race -shuffle=on -count=1 ./...

      # Strict mode turns a divergence from a reference shell into a failure.
      # CI has a known toolbox, which is the condition that makes that fair; on a
      # developer's machine the same test reports and does not fail.
      #
      # macOS is the exception, and reports instead. The only reference shell it
      # ships is bash 3.2 -- Apple froze it in 2007 over the GPLv3 change -- so a
      # divergence there is as likely to be nineteen years of bash as anything
      # about Nemosh. Gating on it would make the build depend on a shell nobody
      # is targeting. The output is still printed, so a real difference is
      # visible; it is just not a veto.
      - name: differential against reference shells
        shell: bash
        env:
          NEMOSH_DIFFERENTIAL: ${{ runner.os == 'macOS' && 'report' || 'strict' }}
        run: go test ./internal/testutil/behavior/ -run Differential -count=1 -v

      # Fuzz seeds are run as ordinary tests on every platform: the corpus in
      # testdata holds the inputs that have already broken something, so a
      # regression is caught without spending CI time exploring.
      - name: fuzz corpus regression
        run: go test ./internal/shell/runtime/ -run 'Fuzz' -count=1

      # A short exploration on Linux only. Long enough to be worth having, short
      # enough not to make every push wait; anything it finds is written to
      # testdata and becomes a seed above.
      - name: fuzz exploration
        if: runner.os == 'Linux'
        run: |
          go test ./internal/shell/runtime/ -run FuzzParseScript$ -fuzz 'FuzzParseScript$' -fuzztime 60s
          go test ./internal/shell/runtime/ -run 'FuzzMatchShellPattern$' -fuzz 'FuzzMatchShellPattern$' -fuzztime 30s

      - name: applet manifest freshness
        run: go test ./internal/appletmanifest/ -count=1

      # The release build path is exercised on every run rather than first at
      # release time. It proves three things a unit test cannot: that the tags
      # this clone fetched reach the version script, that -trimpath and
      # -ldflags -X actually reach internal/version, and that both flags answer
      # without a terminal -- the condition a package manager asks them under.
      - name: release build and version derivation
        shell: bash
        run: |
          mkdir -p dist
          binary="dist/nemosh"
          [ "$RUNNER_OS" = "Windows" ] && binary="dist/nemosh.exe"
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w $(bash scripts/version.sh --ldflags)" \
            -o "$binary" ./cmd/nemosh
          version=$("$binary" --version)
          echo "$version"
          case "$version" in
            "nemosh v"*) ;;
            *) echo "version line is malformed"; exit 1 ;;
          esac
          applets=$("$binary" --list | wc -l)
          echo "--list reports $applets applets"
          [ "$applets" -gt 0 ] || { echo "--list reported nothing"; exit 1; }
          # A shallow clone would silently yield the v0.0.1 fallback forever, so
          # once a real tag exists this must stop reporting it.
          if git describe --tags --abbrev=0 --match='v[0-9]*' --exclude='*-*' HEAD >/dev/null 2>&1; then
            case "$version" in
              *v0.0.*) echo "a semver tag is reachable but the fallback base was used; is fetch-depth 0 set?"; exit 1 ;;
            esac
          fi

      # Binary size is the one performance number that is deterministic enough to
      # gate on. Wall-clock time is not -- five consecutive startups on an idle
      # machine measured 43, 45, 42, 26 and 43 ms -- so the timing side of the
      # baseline lives in allocation ceilings in the Go tests instead.
      #
      # Measured at 3.78 MiB stripped and 5.58 MiB unstripped, so this ceiling
      # leaves about 19% for growth while still catching the two regressions that
      # matter: -s -w falling out of the release flags, and a heavy dependency
      # arriving without anyone noticing.
      - name: binary size ceiling
        shell: bash
        run: |
          binary="dist/nemosh"
          [ "$RUNNER_OS" = "Windows" ] && binary="dist/nemosh.exe"
          size=$(wc -c < "$binary")
          ceiling=4718592
          echo "$binary is $size bytes, ceiling $ceiling"
          if [ "$size" -gt "$ceiling" ]; then
            echo "the binary grew past the ceiling; check the release flags and go.mod before raising it"
            exit 1
          fi

      - name: production file size ceiling
        shell: bash
        run: |
          status=0
          for file in $(git ls-files '*.go' | grep -v _test.go); do
            lines=$(grep -v '^[[:space:]]*$' "$file" | grep -v '^[[:space:]]*//' | wc -l)
            if [ "$lines" -gt 250 ]; then
              echo "$file has $lines pure lines, over the 250 ceiling"
              status=1
            fi
          done
          exit $status
