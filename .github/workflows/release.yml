name: Release

# Every push to master publishes a prerelease, and the tag for it is created by
# the publish step rather than by hand. That is the pattern xiongnemo/Saki and
# xiongnemo/nermius already use, and it fits the versioning rule in AGENTS.md
# exactly: the automatic tag carries a branch and a commit
# (`v0.0.178-master-57b96893ed4d`), so `scripts/version.sh --exclude='*-*'`
# refuses it as a base and only a hand-made exact tag such as `v0.1.0` moves the
# version line.
#
# Pushing an exact `vMAJOR.MINOR.PATCH` tag publishes a full release instead.
#
# The Product workflow is the gate. This one builds what that workflow already
# proved, so it runs the tests once more and then packages, rather than
# re-litigating formatting and the corpus.

on:
  workflow_dispatch:
  # A pull request builds, verifies, and uploads without publishing, because the
  # publish job is gated on a push event. That is deliberate: the release path
  # is the one thing that cannot be tried out after the fact -- a broken step is
  # otherwise discovered by a red run on master, or by a wrong artifact already
  # attached to a release.
  pull_request:
  push:
    branches:
      - master
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  GOPROXY: https://goproxy.cn,direct

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    # The version the artifacts were built with, so the publish job does not have
    # to work it out a second time -- the alternative is what shipped v1.0.0 with
    # ten mislabelled files attached.
    outputs:
      version: ${{ steps.meta.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # windows/amd64 is the only target, from 2026-11-17. Binaries for linux and
          # darwin, and the linux .deb, .rpm and .apk packages, were published as an
          # unsupported convenience until then.
          - goos: windows
            goarch: amd64
            runner: windows-latest
            extension: .exe

    steps:
      # fetch-depth: 0 because the version is derived from tags. A shallow
      # clone has none and would silently publish the v0.0.1 fallback.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test -count=1 ./...

      - id: meta
        name: Compute version
        shell: bash
        run: |
          set -euo pipefail
          # One implementation of the derivation, shared with local release
          # builds, so CI and a developer cannot compute different versions.
          version=$(bash scripts/version.sh --version)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "ldflags=$(bash scripts/version.sh --ldflags)" >> "$GITHUB_OUTPUT"
          echo "artifact=nemosh-${version}-${{ matrix.goos }}-${{ matrix.goarch }}" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          staging="dist/${{ steps.meta.outputs.artifact }}"
          mkdir -p "$staging"
          go build -trimpath \
            -ldflags "-s -w ${{ steps.meta.outputs.ldflags }}" \
            -o "$staging/nemosh${{ matrix.extension }}" ./cmd/nemosh
          cp LICENSE NOTICE THIRD-PARTY-NOTICES.md README.md "$staging/"

      # The published binary must be the one that answered here, so this runs
      # against the staged artifact rather than rebuilding.
      - name: Verify the artifact
        shell: bash
        run: |
          set -euo pipefail
          binary="dist/${{ steps.meta.outputs.artifact }}/nemosh${{ matrix.extension }}"
          reported=$("$binary" --version)
          echo "$reported"
          case "$reported" in
            "nemosh ${{ steps.meta.outputs.version }} "*) ;;
            *) echo "artifact reports a version the build did not compute"; exit 1 ;;
          esac
          applets=$("$binary" --list | wc -l)
          [ "$applets" -gt 0 ] || { echo "--list reported nothing"; exit 1; }
          echo "$applets applets"

      - name: Archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          staging="${{ steps.meta.outputs.artifact }}"
          archive="$staging.zip"
          if command -v 7z >/dev/null 2>&1; then
            7z a -tzip "$archive" "$staging" >/dev/null
          else
            zip -r "$archive" "$staging" >/dev/null
          fi
          sha256sum "$archive" > "$archive.sha256"
          cat "$archive.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish
    needs: [build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
      # Provenance is signed with a short-lived OIDC token minted for this run,
      # which is what makes the attestation say something a checksum cannot: not
      # merely that the file is unaltered, but that *this workflow, at this
      # commit* produced it. Least privilege still applies -- these two are the
      # whole of what attest-build-provenance needs.
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      - id: meta
        name: Compute release metadata
        shell: bash
        env:
          # From the build job, not from scripts/version.sh again.
          #
          # This job used to re-derive it, and pushing a commit and then a tag on
          # that same commit is all it took to break: the branch run's build jobs
          # computed v0.1.148 and stamped it into their artifacts, and by the time
          # this job ran the v1.0.0 tag existed, so version.sh answered v1.0.0.
          # GITHUB_REF_TYPE was still `branch`, so the else branch below named the
          # release v1.0.0 and uploaded the v0.1.148 files into it. The v1.0.0
          # release carried ten artifacts labelled as a dev prerelease, and no
          # v0.1.148 release existed at all.
          #
          # Two derivations of one fact, which is the shape of bug this repository
          # keeps writing down. There is one now.
          BUILT_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          version="${BUILT_VERSION}"
          if [ -z "$version" ]; then
            echo "the build job reported no version; refusing to guess one"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          # A branch run publishes a prerelease under a marker tag, and a marker
          # tag always carries a dash. If the version it built has none, the base
          # tag was created underneath this run and the artifacts are already
          # stale -- publishing them anywhere is wrong, and publishing them into
          # the release for that tag is what happened.
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            case "$version" in
              *-*) ;;
              *)
                echo "a branch run built $version, which is an exact release tag."
                echo "the tag was pushed while this run was building; the tag's own"
                echo "run publishes it. Stopping rather than attaching stale files."
                exit 1
                ;;
            esac
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # An exact semver tag already exists; publish under it as a full
            # release rather than inventing a second name for the same commit.
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "name=nemosh ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            # The headline has to follow the flag. It did not: the body below
            # opened with a hardcoded "**Pre-release.**" on every publish, so an
            # exact tag would have produced a release marked as full by the API
            # and announcing itself as a prerelease in its own notes. Nothing
            # would have failed; the first release of the version line would
            # simply have contradicted itself in writing.
            echo "headline=**Release.** See [CHANGELOG.md](https://github.com/xiongnemo/nemosh/blob/${GITHUB_REF_NAME}/CHANGELOG.md) for what changed." >> "$GITHUB_OUTPUT"
          else
            echo "tag=${version}" >> "$GITHUB_OUTPUT"
            echo "name=Dev prerelease ${version}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "headline=**Pre-release**, published automatically from a push to master." >> "$GITHUB_OUTPUT"
          fi

      # Attested before publishing, so a release can never carry an artifact that
      # has no provenance -- the failure mode worth avoiding is the one where the
      # download exists and the attestation quietly does not.
      #
      # This is deliberately not a substitute for code signing, and it does not
      # quiet SmartScreen: it answers a different question. A checksum says the
      # file is the file; this says which workflow, at which commit, built it.
      # Verified with `gh attestation verify <file> --repo xiongnemo/nemosh`.
      - name: Attest provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/*.zip

      - name: Publish
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.sha256
          body: |
            Nemosh ${{ steps.meta.outputs.version }}

            ${{ steps.meta.outputs.headline }}

            `windows/amd64` is the only target; see
            [`docs/support-matrix.md`](https://github.com/xiongnemo/nemosh/blob/master/docs/support-matrix.md)
            for what is implemented and what is refused, measured rather than
            claimed.

            Verify the download against the `.sha256` beside it, and its origin
            with:

            ```
            gh attestation verify <file> --repo xiongnemo/nemosh
            ```

            Commit: `${{ github.sha }}`

      # Every channel this release reaches is told through one dispatch, to the
      # package repository. It passes the release on to the Scoop bucket's Excavator
      # -- which this job used to dispatch itself, until 2026-10-22, when the package
      # repository took it over so that a release does not trigger the bucket twice.
      # It also indexed the Linux packages for apt, dnf and apk, which are no longer
      # built from 2026-11-17.
      #
      # What that step learned still holds, and now lives in xiongnemo/packages'
      # publish.yml. The bucket's hourly cron alone is slow and lossy: on
      # 2026-08-09 eight prereleases were published and the bucket recorded four,
      # because a sweep packages only whichever release is newest when it fires.
      # So a release is announced rather than left to be found. And the bucket's
      # checkver reads GitHub's releases *list*, which on 2026-09-23 lagged a
      # finished upload by hours -- a dispatch sent then packaged nothing and
      # reported success -- so the dispatch to the bucket waits until the list
      # shows the Windows asset. The Excavator still downloads the archive and
      # hashes it itself, and so does the package repository.
      #
      # The package repository fetches the release by tag, never by that list. A
      # missing token is not a failed release: the step says so and succeeds, and
      # both repositories' own schedules are the backstop. A failed dispatch is a
      # warning for the same reason.
      - name: Tell the package repository
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_DISPATCH_TOKEN }}
          PACKAGES_REPO: ${{ vars.PACKAGES_REPO || 'xiongnemo/packages' }}
          TAG: ${{ steps.meta.outputs.tag }}
          CHANNEL: ${{ steps.meta.outputs.prerelease == 'true' && 'nightly' || 'stable' }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "PACKAGES_DISPATCH_TOKEN is not set, so ${PACKAGES_REPO} will pick this up on its own schedule."
            exit 0
          fi
          gh api "repos/${PACKAGES_REPO}/dispatches" \
            -f event_type=release-published \
            -f "client_payload[repository]=${GITHUB_REPOSITORY}" \
            -f "client_payload[tag]=${TAG}" \
            -f "client_payload[channel]=${CHANNEL}" \
            -f "client_payload[sha]=${GITHUB_SHA}" \
            || echo "::warning title=Package repository not notified::dispatch to ${PACKAGES_REPO} failed; its scheduled sweep is the backstop."
