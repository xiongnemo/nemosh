name: Release

# Every push to master publishes a prerelease, and the tag for it is created by
# the publish step rather than by hand. That is the pattern xiongnemo/Saki and
# xiongnemo/nermius already use, and it fits the versioning rule in AGENTS.md
# exactly: the automatic tag carries a branch and a commit
# (`v0.0.178-master-57b96893ed4d`), so `scripts/version.sh --exclude='*-*'`
# refuses it as a base and only a hand-made exact tag such as `v0.1.0` moves the
# version line.
#
# Pushing an exact `vMAJOR.MINOR.PATCH` tag publishes a full release instead.
#
# The Product workflow is the gate. This one builds what that workflow already
# proved, so it runs the tests once more and then packages, rather than
# re-litigating formatting and the corpus.

on:
  workflow_dispatch:
  # A pull request builds, verifies, and uploads without publishing, because the
  # publish job is gated on a push event. That is deliberate: the release path
  # is the one thing that cannot be tried out after the fact -- a broken step is
  # otherwise discovered by a red run on master, or by a wrong artifact already
  # attached to a release.
  pull_request:
  push:
    branches:
      - master
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  GOPROXY: https://goproxy.cn,direct

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # windows/amd64 is the supported target. The others are published
          # because the README's first line says cross-platform and shipping only
          # one binary under-delivers on that -- but publishing is not promising:
          # docs/support-matrix.md still names Windows as the only supported
          # platform, and the release notes say so beside the download.
          #
          # `native` marks the entries whose tests can actually run on their
          # runner. A cross-compiled darwin binary cannot be executed on Linux,
          # and pretending otherwise would run the host's tests four times and
          # call it coverage.
          - goos: windows
            goarch: amd64
            runner: windows-latest
            extension: .exe
            native: true
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            native: true
          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
          - goos: darwin
            goarch: amd64
            runner: ubuntu-latest
          - goos: darwin
            goarch: arm64
            runner: ubuntu-latest

    steps:
      # fetch-depth: 0 because the version is derived from tags. A shallow
      # clone has none and would silently publish the v0.0.1 fallback.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      # Only where the target is the runner. A cross-compiled binary cannot be
      # executed here, and the Product workflow is what covers the platforms this
      # job can only compile for.
      - name: Test
        if: matrix.native
        run: go test -count=1 ./...

      - id: meta
        name: Compute version
        shell: bash
        run: |
          set -euo pipefail
          # One implementation of the derivation, shared with local release
          # builds, so CI and a developer cannot compute different versions.
          version=$(bash scripts/version.sh --version)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "ldflags=$(bash scripts/version.sh --ldflags)" >> "$GITHUB_OUTPUT"
          echo "artifact=nemosh-${version}-${{ matrix.goos }}-${{ matrix.goarch }}" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          staging="dist/${{ steps.meta.outputs.artifact }}"
          mkdir -p "$staging"
          go build -trimpath \
            -ldflags "-s -w ${{ steps.meta.outputs.ldflags }}" \
            -o "$staging/nemosh${{ matrix.extension }}" ./cmd/nemosh
          cp LICENSE NOTICE THIRD-PARTY-NOTICES.md README.md "$staging/"

      # The published binary must be the one that answered here, so this runs
      # against the staged artifact rather than rebuilding.
      - name: Verify the artifact
        if: matrix.goos == 'windows' && runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          binary="dist/${{ steps.meta.outputs.artifact }}/nemosh${{ matrix.extension }}"
          reported=$("$binary" --version)
          echo "$reported"
          case "$reported" in
            "nemosh ${{ steps.meta.outputs.version }} "*) ;;
            *) echo "artifact reports a version the build did not compute"; exit 1 ;;
          esac
          applets=$("$binary" --list | wc -l)
          [ "$applets" -gt 0 ] || { echo "--list reported nothing"; exit 1; }
          echo "$applets applets"

      # zip for Windows, tar.gz elsewhere, and that is functional rather than
      # conventional: a zip does not carry the Unix executable bit, so a Linux
      # user who unpacked one would get a file they then had to chmod. tar keeps
      # the mode the build gave it.
      - name: Archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          staging="${{ steps.meta.outputs.artifact }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            archive="$staging.zip"
            if command -v 7z >/dev/null 2>&1; then
              7z a -tzip "$archive" "$staging" >/dev/null
            else
              zip -r "$archive" "$staging" >/dev/null
            fi
          else
            archive="$staging.tar.gz"
            chmod +x "$staging/nemosh"
            tar -czf "$archive" "$staging"
          fi
          sha256sum "$archive" > "$archive.sha256"
          cat "$archive.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
      # Provenance is signed with a short-lived OIDC token minted for this run,
      # which is what makes the attestation say something a checksum cannot: not
      # merely that the file is unaltered, but that *this workflow, at this
      # commit* produced it. Least privilege still applies -- these two are the
      # whole of what attest-build-provenance needs.
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - id: meta
        name: Compute release metadata
        shell: bash
        run: |
          set -euo pipefail
          version=$(bash scripts/version.sh --version)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # An exact semver tag already exists; publish under it as a full
            # release rather than inventing a second name for the same commit.
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "name=nemosh ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            # The headline has to follow the flag. It did not: the body below
            # opened with a hardcoded "**Pre-release.**" on every publish, so an
            # exact tag would have produced a release marked as full by the API
            # and announcing itself as a prerelease in its own notes. Nothing
            # would have failed; the first release of the version line would
            # simply have contradicted itself in writing.
            echo "headline=**Release.** See [CHANGELOG.md](https://github.com/xiongnemo/nemosh/blob/${GITHUB_REF_NAME}/CHANGELOG.md) for what changed." >> "$GITHUB_OUTPUT"
          else
            echo "tag=${version}" >> "$GITHUB_OUTPUT"
            echo "name=Dev prerelease ${version}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "headline=**Pre-release**, published automatically from a push to master." >> "$GITHUB_OUTPUT"
          fi

      # Attested before publishing, so a release can never carry an artifact that
      # has no provenance -- the failure mode worth avoiding is the one where the
      # download exists and the attestation quietly does not.
      #
      # This is deliberately not a substitute for code signing, and it does not
      # quiet SmartScreen: it answers a different question. A checksum says the
      # file is the file; this says which workflow, at which commit, built it.
      # Verified with `gh attestation verify <file> --repo xiongnemo/nemosh`.
      - name: Attest provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/*.zip
            dist/*.tar.gz

      - name: Publish
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          body: |
            Nemosh ${{ steps.meta.outputs.version }}

            ${{ steps.meta.outputs.headline }}

            `windows/amd64` is the supported target; see
            [`docs/support-matrix.md`](https://github.com/xiongnemo/nemosh/blob/master/docs/support-matrix.md)
            for what is implemented and what is refused, measured rather than
            claimed.

            Binaries for `linux/amd64`, `linux/arm64`, `darwin/amd64` and
            `darwin/arm64` are published as a convenience and are **not
            supported**. Linux is compiled and tested in CI; darwin is compiled
            only and never executed. Bugs there are welcome as reports and are
            not release blockers. Windows archives are `.zip`; the rest are
            `.tar.gz`, because a zip does not carry the executable bit.

            Verify the download against the `.sha256` beside it, and its origin
            with:

            ```
            gh attestation verify <file> --repo xiongnemo/nemosh
            ```

            Commit: `${{ github.sha }}`

      # The Scoop bucket finds out about a release through its own Excavator,
      # which runs on an hourly cron. That is both slow and lossy: GitHub delays
      # scheduled runs (measured on this bucket at 32, 39 and 52 minutes past the
      # hour) and drops them under load, and a sweep only ever packages whichever
      # release is newest when it fires. Measured on 2026-08-09, eight
      # prereleases were published and the bucket recorded four -- v0.1.11,
      # v0.1.14 and v0.1.16 were never packaged at all.
      #
      # So the release tells the bucket rather than waiting to be found. The
      # Excavator still does the work: it downloads the published archive and
      # computes the hash itself, which is what keeps the manifest honest and is
      # why this dispatches the existing workflow instead of writing a manifest
      # from here. All this removes is the waiting.
      #
      # A release is not held up by this. The default GITHUB_TOKEN deliberately
      # cannot start a workflow in another repository, so without the secret the
      # step says so and succeeds, leaving the hourly cron exactly as it was.
      - name: Tell the Scoop bucket to update
        env:
          GH_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "SCOOP_BUCKET_TOKEN is not set, so the bucket will pick this up on its own schedule."
            echo "To make it immediate, add a fine-grained token with Actions: read and write on"
            echo "xiongnemo/windows-binaries-scoop-bucket as the SCOOP_BUCKET_TOKEN secret here."
            exit 0
          fi
          gh workflow run excavator.yml --repo xiongnemo/windows-binaries-scoop-bucket
